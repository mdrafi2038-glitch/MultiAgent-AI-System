services:
  - type: web
    name: multiagent-ai-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: APP_DB_PATH
        value: ./data/multiagent.db
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: AI_MODEL
        value: openrouter/free
      - key: RENDER_SERVICE_ID
        value: srv-dbsk8auk1f9s739hh760
      - key: RENDER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_MODEL
        sync: false
      - key: IMAGE_API_BASE_URL
        sync: false
      - key: VIDEO_API_URL
        sync: false
      - key: VIDEO_API_KEY
        sync: false
      - key: BROWSERLESS_URL
        sync: false
      - key: BROWSERLESS_TOKEN
        sync: false
      - key: BROWSER_ALLOWED_HOSTS
        sync: false
